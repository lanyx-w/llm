[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pethospital-mcp"
version = "0.2.0"
description = "宠物医院 REST API 的 MCP Server（list_pets / create_pet）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "respx>=0.21",
]

[project.scripts]
pethospital-mcp = "pethospital_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["pethospital_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 118
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]